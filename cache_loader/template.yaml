AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  cache_loader

Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    LoggingConfig:
      LogFormat: JSON

Resources:
  CacheLoaderServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Events:
        MyMSKEvent:
          Type: MSK
          Properties:
            StartingPosition: LATEST
            Topics:
              - cache_loader_consumer
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            Enabled: true
      Environment:
        Variables:
          # ── MongoDB (hardcoded, like post-ingestor) ──
          EPA_MONGODB_HOSTNAME: "epa-db"
          EPA_MONGODB_PORT: "27017"
          EPA_MONGODB_USERNAME: "test"
          EPA_MONGODB_PASSWORD: "test"
          EPA_MONGODB_DATABASE_NAME: "epa_database"
          EPA_MONGODB_USER_COLLECTION: "users"
          EPA_MONGODB_SESSION_TOKEN_COLLECTION: "session_tokens"
          EPA_MONGODB_POSTS_COLLECTION: "posts"
          EPA_MONGODB_CATEGORIES_COLLECTION: "categories"
          
          # ── Redis (hardcoded) ──
          EPA_REDIS_HOSTNAME: "epa-redis"
          EPA_REDIS_PORT: "6379"
          EPA_REDIS_PASSWORD: "test"
          EPA_REDIS_USE_SSL: "false"
          
          # ── Kafka (for event parsing, not connection) ──
          EPA_KAFKA_TOPIC_CACHELOADER_NAME: "cache_loader_consumer"

    Metadata:
      DockerTag: provided.al2-v1
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  CacheLoaderServiceFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt CacheLoaderServiceFunction.Arn