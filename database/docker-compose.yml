services:
   epa_database:
     image: mongo:8.2.3-noble
     restart: always
     environment:
       MONGO_INITDB_ROOT_USERNAME: ${EPA_MONGODB_USERNAME}
       MONGO_INITDB_ROOT_PASSWORD: ${EPA_MONGODB_PASSWORD}
     ports:
      - "27017:27017"
     hostname: epa-db
     healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 12
      start_period: 5s
      timeout: 2s
      
   epa_database_init:
      build:
        context: .
      depends_on:
       - epa_database
      environment:
       EPA_MONGODB_HOSTNAME: ${EPA_MONGODB_HOSTNAME}
       EPA_MONGODB_PORT: ${EPA_MONGODB_PORT}
       EPA_MONGODB_USERNAME: ${EPA_MONGODB_USERNAME}
       EPA_MONGODB_PASSWORD: ${EPA_MONGODB_PASSWORD}
       EPA_MONGODB_DATABASE_NAME: ${EPA_MONGODB_DATABASE_NAME}