name: Build & Test Post Ingestor (SAM Local)

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-post-ingestor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Build Database Container
        run: docker compose -f ./database/docker-compose.yml build epa_database

      - name: Build Post Ingestor Container
        run: docker compose -f ./post_ingestor/docker-compose.yml build epa_post_ingestor

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Verify SAM CLI
        run: sam --version

      - name: Start Database Stack
        run: |
          docker compose -p sam-test -f ./database/docker-compose.yml up -d --build

          echo "Waiting for MongoDB to become healthy..."
          for i in {1..30}; do
            if docker compose -p sam-test -f ./database/docker-compose.yml exec -T epa_database \
              mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep -q "1"; then
              echo "MongoDB is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB failed to become healthy"
          docker compose -p sam-test -f ./database/docker-compose.yml ps
          docker compose -p sam-test -f ./database/docker-compose.yml logs epa_database || true
          docker compose -p sam-test -f ./database/docker-compose.yml logs epa_database_init || true
          exit 1

      - name: Create env.json for SAM test
        working-directory: ./post_ingestor
        run: |
          cat > env.json <<'EOF'
          {
            "PostIngestorFunction": {
              "EPA_MONGODB_HOSTNAME": "epa-db",
              "EPA_MONGODB_PORT": "27017",
              "EPA_MONGODB_USERNAME": "test",
              "EPA_MONGODB_PASSWORD": "test",
              "EPA_MONGODB_SESSION_TOKEN_COLLECTION": "session_tokens",
              "EPA_MONGODB_DATABASE_NAME": "epa_database",
              "EPA_MONGODB_USER_COLLECTION": "users",
              "EPA_MONGODB_POSTS_COLLECTION": "posts"
            }
          }
          EOF
          cat env.json

      - name: SAM Build
        working-directory: ./post_ingestor
        run: sam build --use-container

        
      - name: SAM Local Invoke Test
        working-directory: ./post_ingestor
        run: |
          echo "=== Verifying test files ==="
          test -f env.json && echo "✓ env.json exists" || { echo "✗ env.json missing"; exit 1; }
          test -f events/ingest_posts.json && echo "✓ ingest_posts.json exists" || { echo "✗ ingest_posts.json missing"; exit 1; }

          echo ""
          echo "=== Invoking Lambda function ==="
          sam local invoke PostIngestorFunction \
            --event ./events/ingest_posts.json \
            --env-vars ./env.json \
            --docker-network sam-test_default \
            --log-file sam-test.log \
            > response.json 2>&1 || {
              echo "SAM command failed with exit code $?"
              cat sam-test.log || echo "No logs available"
              exit 1
            }

          echo ""
          echo "=== Response file contents ==="
          cat response.json || echo "[EMPTY]"

          echo ""
          echo "=== Response file size ==="
          wc -c < response.json

          echo ""
          echo "=== Function execution logs ==="
          cat sam-test.log || echo "No function logs"

          echo ""
          echo "=== Validating response ==="
          if [ ! -s response.json ]; then
            echo "ERROR: Response is empty. Function likely crashed."
            exit 1
          fi

          # Try to parse with jq and show what we got
          echo "Response parsed by jq:"
          jq '.' response.json || echo "Not valid JSON"

          # Run validation
          jq -e '.statusCode == 200 and (.body | type == "object") and (.body.inserted | type == "number") and (.body.inserted >= 1)' response.json

          echo "✓ Test passed: statusCode=200, inserted >= 1"

      - name: Cleanup Database
        if: always()
        run: docker compose -p sam-test -f ./database/docker-compose.yml down -v --remove-orphans || true