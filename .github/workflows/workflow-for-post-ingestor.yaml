name: Build & Test Post Ingestor (SAM Local)

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-post-ingestor:
    runs-on: ubuntu-latest

    env:
      EPA_MONGODB_USERNAME: test
      EPA_MONGODB_PASSWORD: test
      EPA_MONGODB_HOSTNAME: epa-db
      EPA_MONGODB_PORT: "27017"
      EPA_MONGODB_DATABASE_NAME: epa_database

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate Docker + Compose
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Verify SAM CLI
        shell: bash
        run: |
          set -euo pipefail
          sam --version

      # ---- Start MongoDB dependency stack ----
      - name: Start Database Stack
        shell: bash
        run: |
          set -euo pipefail

          docker compose -p sam-test -f ./database/docker-compose.yml up -d --build

          echo "Waiting for MongoDB to become healthy..."
          for i in {1..30}; do
            # Target (epa_database)
            if docker compose -p sam-test -f ./database/docker-compose.yml exec -T epa_database \
              mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep -q "1"; then
              echo "MongoDB is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB failed to become healthy"
          docker compose -p sam-test -f ./database/docker-compose.yml ps
          docker compose -p sam-test -f ./database/docker-compose.yml logs epa_database || true
          docker compose -p sam-test -f ./database/docker-compose.yml logs epa_database_init || true
          exit 1

      # ---- SAM build in post_ingestor/ ----
      - name: SAM Build (post_ingestor)
        working-directory: ./post_ingestor
        shell: bash
        run: |
          set -euo pipefail
          sam build

      - name: SAM Local Invoke Test
        working-directory: ./post_ingestor
        shell: bash
        run: |
          set -euo pipefail  
          sam build --use-container --template template.yaml

          test -f env.json
          test -f events/ingest_posts.json

          # Run invoke and capture FULL output (stdout + stderr) to response.json
          sam local invoke PostIngestorFunction \
            --event ./events/ingest_posts.json \
            --env-vars ./env.json \
            --docker-network sam-test_default \
            --log-file sam-test.log \
            2>&1 > response.json

          echo "---- Lambda response ----"
          cat response.json

          # Validate JSON and structure
          python3 - <<'PY'
          import json, sys
          try:
              with open("response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except json.JSONDecodeError as e:
              print(f"FAIL: JSON decode error: {e}")
              sys.exit(1)

          status = data.get("statusCode")
          body = data.get("body")
          inserted = None

          if isinstance(body, str):
              try:
                  body = json.loads(body)
              except json.JSONDecodeError:
                  pass  # leave as string if not JSON

          if isinstance(body, dict):
              inserted = body.get("inserted")

          if status != 200:
              print(f"FAIL: statusCode={status}")
              sys.exit(2)

          try:
              inserted_int = int(inserted)
          except (ValueError, TypeError):
              print(f"FAIL: body.inserted missing/not int: {inserted!r}")
              sys.exit(3)

          if inserted_int < 1:
              print(f"FAIL: inserted={inserted_int}, expected >= 1")
              sys.exit(4)

          print(f"PASS: statusCode=200 inserted={inserted_int}")
          PY

          echo "---- SAM logs ----"
          cat sam-test.log || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker compose -p sam-test -f ./database/docker-compose.yml down -v --remove-orphans || true
          docker compose -p sam-test -f ./database/docker-compose.yml down -v --remove-orphans || true
