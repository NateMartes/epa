name: Build & Test Post Ingestor (SAM Local)

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-post-ingestor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Build Database Container
        run: docker compose -f ./database/docker-compose.yml build epa_database

      - name: Build Post Ingestor Container
        run: docker compose -f ./post_ingestor/docker-compose.yml build epa_post_ingestor

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Verify SAM CLI
        run: sam --version

      - name: Start Database Stack
        run: |
          export EPA_MONGODB_USERNAME=test
          export EPA_MONGODB_PASSWORD=test
          export EPA_MONGODB_HOSTNAME=epa_database
          export EPA_MONGODB_PORT=27017
          export EPA_MONGODB_DATABASE_NAME=epa_database
          
          docker compose -p sam-test -f ./database/docker-compose.yml up -d --build

          echo "Waiting for MongoDB to become healthy..."
          for i in {1..30}; do
            if docker compose -p sam-test -f ./database/docker-compose.yml exec -T epa_database \
              mongosh --quiet --eval "db.adminCommand({ping:1}).ok" 2>&1 | grep -q "1"; then
              echo "MongoDB is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB failed to become healthy"
          docker compose -p sam-test -f ./database/docker-compose.yml logs epa_database || true
          exit 1

      - name: Create env.json for SAM test
        working-directory: ./post_ingestor
        run: |
          cat > env.json <<'EOF'
          {
            "PostIngestorFunction": {
              "EPA_MONGODB_USERNAME": "test",
              "EPA_MONGODB_PASSWORD": "test",
              "EPA_MONGODB_HOSTNAME": "epa_database",
              "EPA_MONGODB_PORT": "27017",
              "EPA_MONGODB_DATABASE_NAME": "epa_database",
              "EPA_MONGODB_POSTS_COLLECTION": "posts",
              "EPA_MONGODB_USER_COLLECTION": "users",
              "EPA_MONGODB_SESSION_TOKEN_COLLECTION": "sessions"
            }
          }
          EOF
          echo "env.json created:"
          cat env.json

      - name: SAM Build
        working-directory: ./post_ingestor
        run: sam build --use-container

      - name: SAM Local Invoke Test
        working-directory: ./post_ingestor
        run: |

          ls -a
          cat env.json
          
          echo "Verifying test files..."
          test -f env.json && echo "env.json exists" || { echo "Missing env.json"; exit 1; }
          test -f events/ingest_posts.json && echo "ingest_posts.json exists" || { echo "Missing ingest_posts.json"; exit 1; }

          echo ""
          echo "Invoking Lambda function with Kafka-formatted event..."
          # Proper stream separation
          #   stdout → Lambda response JSON
          #   stderr → SAM diagnostics (not mixed into response)
          sam local invoke PostIngestorFunction \
            --event ./events/ingest_posts.json \
            --env-vars ./env.json \
            --docker-network sam-test_default \
            --log-file sam-test.log \
            > response.json 2> sam-cli.log

          SAM_EXIT=$?
          echo "SAM exit code: $SAM_EXIT"
          echo ""
          echo "=== Lambda Response (stdout) ==="
          cat response.json || echo "[EMPTY RESPONSE]"

          # Diagnose failures immediately
          if [ $SAM_EXIT -ne 0 ]; then
            echo ""
            echo "=== SAM CLI Diagnostics (stderr) ==="
            cat sam-cli.log
            echo ""
            echo "=== Function Execution Logs ==="
            cat sam-test.log 2>/dev/null | tail -50 || echo "No function logs"
            exit $SAM_EXIT
          fi

          if [ ! response.json ]; then
            echo ""
            echo "ERROR: Empty response - function likely crashed"
            echo "=== Function Logs ==="
            cat sam-test.log 2>/dev/null | tail -50 || echo "No logs"
            exit 1
          fi

          echo ""
          echo "=== Validating Response ==="
          if ! jq empty response.json >/dev/null 2>&1; then
            echo "ERROR: response.json is not valid JSON:"
            cat response.json
            echo ""
            echo "=== Function Logs (last 50 lines) ==="
            cat sam-test.log 2>/dev/null | tail -50 || echo "No logs"
            exit 1
          fi

          if ! jq -e '.statusCode == 200 and (.body.inserted | type == "number")' response.json >/dev/null 2>&1; then
            echo "ERROR: Response validation failed. Expected {statusCode:200, body:{inserted:<number>}}"
            jq '.' response.json || cat response.json
            exit 1
          fi

          INSERTED=$(jq -r '.body.inserted' response.json)
          echo "Test passed: statusCode=200, inserted=$INSERTED posts"

          echo ""
          echo "=== Verifying Decoded Storage in MongoDB ==="
          docker compose -p sam-test -f ./database/docker-compose.yml exec -T epa_database \
            mongosh --quiet --eval "
              db = db.getSiblingDB('epa_database');
              count = db.posts.countDocuments();
              doc = db.posts.findOne();
              if (count > 0 && doc && doc.title && typeof doc.title === 'string' && !doc.title.includes('eyJ')) {
                print('SUCCESS: ' + count + ' posts stored as DECODED JSON (not base64)');
                print('  Sample title: ' + doc.title);
              } else if (count > 0 && doc && doc.title && doc.title.includes('eyJ')) {
                print('FAILURE: Posts stored as base64 strings (not decoded!)');
                print('  Sample title: ' + doc.title);
                quit(1);
              } else {
                print(count + ' posts in DB, but could not verify decoding status');
              }
            " 2>&1 || true

      - name: Cleanup Database
        if: always()
        run: docker compose -p sam-test -f ./database/docker-compose.yml down -v --remove-orphans || true