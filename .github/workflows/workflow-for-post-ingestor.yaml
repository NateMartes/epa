name: Build & Test Post Ingestor (SAM Local)

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-post-ingestor:
    runs-on: ubuntu-latest
    environment: development
    env:
      EPA_MONGODB_HOSTNAME: ${{ vars.EPA_MONGODB_HOSTNAME }}
      EPA_MONGODB_PORT: ${{ vars.EPA_MONGODB_PORT }}
      EPA_MONGODB_DATABASE_NAME: ${{ vars.EPA_MONGODB_DATABASE_NAME }}
      EPA_MONGODB_POSTS_COLLECTION: ${{ vars.EPA_MONGODB_POSTS_COLLECTION }}
      EPA_MONGODB_USER_COLLECTION: ${{ vars.EPA_MONGODB_USER_COLLECTION }}
      EPA_MONGODB_SESSION_TOKEN_COLLECTION: ${{ vars.EPA_MONGODB_SESSION_TOKEN_COLLECTION }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Build Database Container
        run: docker compose -f ./database/docker-compose.yml build epa_database

      - name: Build Post Ingestor Container
        run: docker compose -f ./post_ingestor/docker-compose.yml build epa_post_ingestor

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Verify SAM CLI
        run: sam --version

      - name: Start Database Stack
        run: |
          export EPA_MONGODB_USERNAME=${{ secrets.EPA_MONGODB_USERNAME }}
          export EPA_MONGODB_PASSWORD=${{ secrets.EPA_MONGODB_PASSWORD }}
          export EPA_MONGODB_HOSTNAME=${{ vars.EPA_MONGODB_HOSTNAME }}
          export EPA_MONGODB_PORT=${{ vars.EPA_MONGODB_PORT }}
          export EPA_MONGODB_DATABASE_NAME=${{ vars.EPA_MONGODB_DATABASE_NAME }}
          
          docker compose -p sam-test -f ./database/docker-compose.yml up -d --build

          echo "Waiting for MongoDB to become healthy..."
          for i in {1..30}; do
            if docker compose -p sam-test -f ./database/docker-compose.yml exec -T epa_database \
              mongosh --quiet --eval "db.adminCommand({ping:1}).ok" 2>&1 | grep -q "1"; then
              echo "MongoDB is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB failed to become healthy"
          docker compose -p sam-test -f ./database/docker-compose.yml logs epa_database || true
          exit 1

      - name: Generate SAM environment variables file
        working-directory: ./post_ingestor
        run: |
          # Dynamically generate env.json using GitHub Actions secrets and variables
          # This is REQUIRED for SAM local invoke to pass env vars to Lambda container
          cat > env.json <<EOF
          {
            "PostIngestorFunction": {
              "EPA_MONGODB_USERNAME": "${{ secrets.EPA_MONGODB_USERNAME }}",
              "EPA_MONGODB_PASSWORD": "${{ secrets.EPA_MONGODB_PASSWORD }}",
              "EPA_MONGODB_HOSTNAME": "${{ vars.EPA_MONGODB_HOSTNAME }}",
              "EPA_MONGODB_PORT": "${{ vars.EPA_MONGODB_PORT }}",
              "EPA_MONGODB_DATABASE_NAME": "${{ vars.EPA_MONGODB_DATABASE_NAME }}",
              "EPA_MONGODB_POSTS_COLLECTION": "${{ vars.EPA_MONGODB_POSTS_COLLECTION }}",
              "EPA_MONGODB_USER_COLLECTION": "${{ vars.EPA_MONGODB_USER_COLLECTION }}",
              "EPA_MONGODB_SESSION_TOKEN_COLLECTION": "${{ vars.EPA_MONGODB_SESSION_TOKEN_COLLECTION }}"
            }
          }
          EOF
          echo "Generated env.json for SAM:"
          jq '.' env.json

      - name: SAM Build
        working-directory: ./post_ingestor
        run: sam build --use-container

      - name: SAM Local Invoke Test
        working-directory: ./post_ingestor
        run: |
          echo "Verifying test files..."
          test -f env.json && echo "env.json exists" || { echo "FATAL: env.json missing"; exit 1; }
          test -f ingest_posts.json && echo "ingest_posts.json exists" || { echo "FATAL: ingest_posts.json missing"; exit 1; }

          echo ""
          echo "Invoking Lambda function..."
          sam local invoke PostIngestorFunction \
            --event ./ingest_posts.json \
            --env-vars ./env.json \
            --docker-network sam-test_default \
            --log-file sam-test.log \
            > response-stdout.json 2> sam-cli.log

          SAM_EXIT=$?
          echo "SAM exit code: $SAM_EXIT"
          echo ""
          echo "Lambda Response (stdout):"
          cat response-stdout.json || echo "[EMPTY]"

          echo ""
          echo "Extracting response from log file..."
          awk 'BEGIN {found=""; brace=0; line=""} 
               /{.*"statusCode".*}/ {
                 line=$0; 
                 brace=gsub(/{/,"{",line)-gsub(/}/,"}",line); 
                 while(brace!=0 && getline>0) {
                   line=line" "$0; 
                   brace+=gsub(/{/,"{",line)-gsub(/}/,"}",line)
                 } 
                 found=line
               } 
               END {print found}' sam-test.log > response.json

          echo "Extracted response content:"
          cat response.json || echo "[NO CONTENT EXTRACTED]"

          if [ ! -s response.json ] || ! jq empty response.json >/dev/null 2>&1; then
            echo ""
            echo "ERROR: Could not extract valid response from logs"
            echo "=== sam-test.log contents ==="
            cat sam-test.log || echo "[LOG FILE MISSING]"
            echo "=== response-stdout.json contents ==="
            cat response-stdout.json || echo "[STDOUT FILE MISSING/EMPTY]"
            exit 1
          fi

          echo ""
          echo "Validating Response"
          STATUS_CODE=$(jq -r '.statusCode // "missing"' response.json 2>/dev/null)
          echo "Status code: $STATUS_CODE"

          if [ "$STATUS_CODE" != "200" ]; then
            echo "ERROR: Expected statusCode 200, got $STATUS_CODE"
            cat response.json
            exit 1
          fi

          INSERTED=$(jq -r '.body.inserted // "missing"' response.json 2>/dev/null)
          echo "Inserted count: $INSERTED"

          if [ "$INSERTED" = "missing" ] || ! echo "$INSERTED" | grep -qE '^[0-9]+$'; then
            echo "ERROR: inserted field missing or not a valid integer"
            cat response.json
            exit 1
          fi

          echo "Test passed: statusCode=200, inserted=$INSERTED"

          echo ""
          echo "Verifying Decoded Storage in MongoDB"
          # Extract credentials from generated env.json
          USERNAME=$(jq -r '.PostIngestorFunction.EPA_MONGODB_USERNAME' env.json)
          PASSWORD=$(jq -r '.PostIngestorFunction.EPA_MONGODB_PASSWORD' env.json)
          DATABASE=$(jq -r '.PostIngestorFunction.EPA_MONGODB_DATABASE_NAME' env.json)
          
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ] || [ -z "$DATABASE" ]; then
            echo "ERROR: Failed to extract MongoDB credentials from env.json"
            cat env.json
            exit 1
          fi
          
          docker compose -p sam-test -f ./database/docker-compose.yml exec -T epa_database \
            mongosh --username "$USERNAME" --password "$PASSWORD" --authenticationDatabase admin "$DATABASE" --quiet --eval "
              count = db.posts.countDocuments();
              doc = db.posts.findOne();
              if (count > 0 && doc && doc.title && typeof doc.title === 'string' && !doc.title.includes('eyJ')) {
                print('SUCCESS: ' + count + ' posts stored as DECODED JSON');
                print('Sample title: ' + doc.title);
              } else if (count > 0 && doc && doc.title && doc.title.includes('eyJ')) {
                print('FAILURE: Posts stored as base64 strings');
                quit(1);
              } else {
                print(count + ' posts in database');
              }
            " 2>&1 || echo "Database verification skipped (non-critical)"

      - name: Cleanup Database
        if: always()
        run: docker compose -p sam-test -f ./database/docker-compose.yml down -v --remove-orphans || true