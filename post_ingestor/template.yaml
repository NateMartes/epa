AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  post_ingestor

  SAM Template for post_ingestor

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    LoggingConfig:
      LogFormat: JSON

Resources:
  PostIngestorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Events:
        MyMSKEvent:
          Type: MSK
          Properties:
            StartingPosition: LATEST
            Topics:
              - new_post
            ConsumerGroupId: post_ingestor_consumer_group <<<<
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            Enabled: true
      Environment:
        Variables:
          EPA_MONGODB_HOSTNAME: "epa-db"
          EPA_MONGODB_PORT: "27017"
          EPA_MONGODB_USERNAME: "test"
          EPA_MONGODB_PASSWORD: "test"
          EPA_MONGODB_USER_COLLECTION: "session_tokens"
          EPA_MONGODB_DATABSE_NAME: "epa_database"
          EPA_MONGODB_USER_COLLECTION: "users"
          EPA_MONGODB_POSTS_COLLECTION: "posts"

    Metadata:
      DockerTag: python3.11-al2-v1
      DockerContext: .
      Dockerfile: Dockerfile